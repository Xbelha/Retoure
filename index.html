<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macis Closing List</title>
    <style>
        :root {
            --primary: #d35400; /* Burnt Orange */
            --bg: #fdf6e3; /* Cream */
            --card-bg: #ffffff;
            --text: #2c3e50;
            --green: #27ae60;
            --header-bg: #1a1a1a;
            --danger: #c0392b;
            --danger-bg: #fadbd8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .logo-container {
            text-align: center;
            background-color: var(--header-bg);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .logo-img {
            max-width: 200px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #bdc3c7;
            color: #2c3e50;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.3);
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card.important {
            border: 3px solid var(--danger);
            background-color: var(--danger-bg);
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(192, 57, 43, 0); }
            100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0); }
        }

        .important-header {
            color: var(--danger);
            margin-top: 0;
            font-size: 1.4rem;
            text-transform: uppercase;
        }

        .reminder-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f2c25;
            line-height: 1.5;
            margin-bottom: 0;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .item-row:last-child { border-bottom: none; }
        .item-name { font-weight: 600; flex-grow: 1; padding-right: 10px; }
        .controls { display: flex; align-items: center; gap: 10px; }

        button.btn-count {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-minus { background-color: #ecf0f1; color: #7f8c8d; }
        .btn-plus { background-color: var(--primary); color: white; }
        .count-display { font-size: 1.2rem; font-weight: bold; width: 30px; text-align: center; }

        .custom-input-group { display: flex; gap: 10px; margin-top: 15px; }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box; 
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-whatsapp { background-color: var(--green); color: white; }
        .btn-reset { background-color: #e74c3c; color: white; margin-top: 20px; }
        .btn-add { background-color: #3498db; color: white; padding: 10px; border: none; border-radius: 8px; }

    </style>
</head>
<body>

    <div class="logo-container">
        <img src="https://macis-leipzig.de/wp-content/uploads/2019/03/macis_Logo_Leipzig_Weiss-1-768x498_neu-300x195.png" alt="Macis Leipzig" class="logo-img">
    </div>

    <div class="tab-container">
        <button id="btn-kondi" class="tab-btn active" onclick="switchTab('kondi')">🍰 Konditorei</button>
        <button id="btn-feinkost" class="tab-btn" onclick="switchTab('feinkost')">🧀 Feinkost</button>
    </div>

    <div class="card important">
        <h3 class="important-header">⚠ ACHTUNG</h3>
        <p class="reminder-text">
            📸 Bitte Foto vom<br>
            <u>Retoure- / Umlagerungs-Zettel</u><br>
            (aus der Kasse) machen und anhängen!
        </p>
    </div>

    <div class="card" id="list-container"></div>

    <div class="card">
        <h3>Extra Produkt hinzufügen</h3>
        <div class="custom-input-group">
            <input type="text" id="new-product-name" placeholder="z.B. Käsekuchen">
            <button class="btn-add" onclick="addNewProduct()">+ Hinzufügen</button>
        </div>
    </div>

    <div class="card">
        <h3>Notizen / Nachricht</h3>
        <textarea id="custom-notes" placeholder="z.B. Alles okay. Schönen Abend!"></textarea>
    </div>

    <button class="action-btn btn-whatsapp" onclick="sendToWhatsapp()">📤 An WhatsApp senden</button>
    <button class="action-btn" style="background-color: #95a5a6; color: white;" onclick="copyText()">📋 Text kopieren</button>
    <button class="action-btn btn-reset" onclick="resetAll()">↻ Alles zurücksetzen</button>

    <script>
        const defaultKondi = [
            "Marmorkuchen", "Zitronenkuchen", "Zupfkuchen", "Flan", "Streuselkuchen",
            "Veg. Schokokuchen", "Veg. Cup Cakes (Karotte/Kürbis)", "Cup Cakes", 
            "Brownie", "Canneles", "Pistazien Cookies", "Torten", "Nussecken", 
            "Walnuss-Hügel", "Zitronentartelette", "Pekannusstartelette", "Madeleines"
        ];

        const defaultFeinkost = [
            "Gut Aufgelegt, Merrettich, rote Bete", "Veganer Aufschnitt, Lyoner Art", "Montanera Serrano",
            "Puten Kochschinken Arresto de Tachino", "Salami Milano", "Mortadella",
            "Dennree Gouda", "Dennree Emmentaler", "Dennree Bergkäse", "Dennree Frischkäse",
            "Fräulein Peschke", "Scharfe Käthe", "Hummus Natur", "Dennree Butter",
            "Söbbeke Mango Vanille", "Söbbecke Pfirsich Maracuja", "Söbbecke Blaubeere",
            "Seezüngle Traube", "Seezüngle Birne", "Seezüngle Rhabarber",
            "St. Georgs still", "St. Georgs medium", "Smoothie Erdbeere Himbeere",
            "Smoothie Banane Yuzu Spirulina", "Smoothie Beere Acai", "Smoothie Mango Maracuja",
            "Smoothie Spinat Minze Spirulina", "Shot Ingwer Natur", "Shot Eisen Shot",
            "Shot Ingwer Kurkuma", "Shot Matcha", "Eier 10er Packung", "Eier 6er Packung",
            "H-Milch 3,5%", "Bio Mandelmilch ungesüßt", "Double Choc Granola",
            "Herbst Winter Granola", "Kokos Aprikose Granola", "Fruchtwiese Sauerkirsch",
            "Fruchtwiese Waldebeere", "Fruchtwiese Aprikose", "Fruchtwiese Erdbeere"
        ];

        let data = {
            kondi: JSON.parse(localStorage.getItem('macis_kondi_v3')) || defaultKondi.map(n => ({ name: n, count: 0 })),
            feinkost: JSON.parse(localStorage.getItem('macis_feinkost_v3')) || defaultFeinkost.map(n => ({ name: n, count: 0 }))
        };

        let currentTab = 'kondi';
        const container = document.getElementById('list-container');
        const notesInput = document.getElementById('custom-notes');

        function switchTab(tabName) {
            currentTab = tabName;
            document.getElementById('btn-kondi').classList.remove('active');
            document.getElementById('btn-feinkost').classList.remove('active');
            document.getElementById(`btn-${tabName}`).classList.add('active');
            render();
        }

        function render() {
            container.innerHTML = '';
            data[currentTab].forEach((prod, index) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <span class="item-name">${prod.name}</span>
                    <div class="controls">
                        <button class="btn-count btn-minus" onclick="changeCount(${index}, -1)">-</button>
                        <span class="count-display">${prod.count}</span>
                        <button class="btn-count btn-plus" onclick="changeCount(${index}, 1)">+</button>
                    </div>
                `;
                container.appendChild(row);
            });
            saveData();
        }

        function changeCount(index, delta) {
            data[currentTab][index].count += delta;
            if (data[currentTab][index].count < 0) data[currentTab][index].count = 0;
            render();
        }

        function addNewProduct() {
            const input = document.getElementById('new-product-name');
            const name = input.value.trim();
            if (name) {
                data[currentTab].push({ name: name, count: 1 });
                input.value = '';
                render();
            }
        }

        function generateMessage() {
            let msg = "";
            let hasItems = false;

            // Konditorei
            let kondiMsg = "*RESTBESTAND HEUTE:*\n";
            let subKondi = "";
            data.kondi.forEach(p => {
                if (p.count > 0) {
                    subKondi += `- ${p.count}x ${p.name}\n`;
                    hasItems = true;
                }
            });
            if (subKondi) msg += kondiMsg + subKondi + "\n";

            // Feinkost (Ohne Restbestand-Satz)
            let subFeinkost = "";
            data.feinkost.forEach(p => {
                if (p.count > 0) {
                    subFeinkost += `- ${p.count}x ${p.name}\n`;
                    hasItems = true;
                }
            });
            if (subFeinkost) msg += "*🧀 FEINKOST:*\n" + subFeinkost + "\n";

            if (!hasItems) msg = "Alles ausverkauft!\n";

            const notes = notesInput.value.trim();
            msg += notes ? notes : "Schönen Abend ☺";
            return msg;
        }

        function sendToWhatsapp() {
            window.open(`https://wa.me/?text=${encodeURIComponent(generateMessage())}`, '_blank');
        }

        function copyText() {
            navigator.clipboard.writeText(generateMessage()).then(() => alert("Text kopiert!"));
        }

        function resetAll() {
            if(confirm("Alle Listen auf 0 setzen?")) {
                data.kondi.forEach(p => p.count = 0);
                data.feinkost.forEach(p => p.count = 0);
                notesInput.value = "";
                render();
            }
        }

        function saveData() {
            localStorage.setItem('macis_kondi_v3', JSON.stringify(data.kondi));
            localStorage.setItem('macis_feinkost_v3', JSON.stringify(data.feinkost));
        }

        render();
    </script>
</body>
</html>
